version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.0
  shellcheck: circleci/shellcheck@3.1

filters: &filters
  branches:
    only:
      - develop
      - cicd
  tags:
    only: /.*/

jobs:
  unit-tests:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Run test suite
          command: |
            for f in test/*.sh; do
              echo "== $f =="
              sh "$f" || bash "$f"
            done

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
      - shellcheck/check:
          filters: *filters
      - unit-tests:
          filters: *filters
      - orb-tools/continue:
          orb_name: aduro-orbs/s5cmd-orb
          pipeline_number: << pipeline.number >>
          vcs_type: github
          requires: [orb-tools/lint, orb-tools/review, orb-tools/pack, shellcheck/check, unit-tests]
          filters: *filters
