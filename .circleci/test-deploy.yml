version: 2.1
orbs:
  orb-tools: circleci/orb-tools@12.0
  s5cmd-orb: {}
filters: &filters
  tags:
    only: /.*/
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

commands:
  setup-minio-bucket:
    parameters:
      seed_object:
        type: boolean
        default: false
    steps:
      - run:
          name: Wait for Minio
          command: |
            until aws --endpoint-url http://localhost:9000 s3 ls 2>/dev/null; do
              echo "Waiting for Minio..."; sleep 2
            done
      - run:
          name: Create test bucket
          command: aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket test-bucket
      - when:
          condition: <<parameters.seed_object>>
          steps:
            - run:
                name: Seed test object
                command: |
                  echo "lorem ipsum" > /tmp/test-file.txt
                  aws --endpoint-url http://localhost:9000 s3 cp /tmp/test-file.txt s3://test-bucket/s5cmd-orb/build_asset.txt

jobs:
  integration-test-install:
    parameters:
      executor:
        type: executor
      version:
        description: Select a specific version of the s5cmd. By default the 2.2.2 version will be used.
        default: 2.2.2
        type: string
      override_installed:
        type: boolean
        default: false
      binary_dir:
        type: string
        default: "/usr/local/bin"
        description: Specify the binary directory
      install_dir:
        type: string
        default: "/usr/local/s5cmd"
        description: Specify the installation directory
    executor: <<parameters.executor>>
    steps:
      - s5cmd-orb/install:
          version: <<parameters.version>>
          override_installed: <<parameters.override_installed>>
          binary_dir: <<parameters.binary_dir>>
          install_dir: <<parameters.install_dir>>

workflows:
  test-deploy:
    jobs:
      - integration-test-install:
          name: integration-test-install-<<matrix.executor>>
          matrix:
            alias: integration-test-install
            parameters:
              executor: [docker-base, macos]
      - s5cmd-orb/cp:
          name: integration-test-cp
          executor: minio
          pre-steps:
            - setup-minio-bucket
            - run:
                name: Create test file
                command: |
                  mkdir -p /tmp/s5cmd-test-bucket
                  echo "lorem ipsum" > /tmp/s5cmd-test-bucket/build_asset.txt
          from: "/tmp/s5cmd-test-bucket/build_asset.txt"
          to: "s3://test-bucket/s5cmd-orb/build_asset.txt"
          endpoint_url: http://localhost:9000
          filters: *filters
      - s5cmd-orb/sync:
          name: integration-test-sync
          executor: minio
          pre-steps:
            - setup-minio-bucket
            - run:
                name: Create test directory
                command: |
                  mkdir -p /tmp/s5cmd-test-bucket
                  echo "lorem ipsum" > /tmp/s5cmd-test-bucket/build_asset.txt
          from: "/tmp/s5cmd-test-bucket/"
          to: "s3://test-bucket/s5cmd-orb-sync/"
          endpoint_url: http://localhost:9000
          filters: *filters
      - s5cmd-orb/ls:
          name: integration-test-ls
          executor: minio
          pre-steps:
            - setup-minio-bucket:
                seed_object: true
          target: "s3://test-bucket/s5cmd-orb/"
          endpoint_url: http://localhost:9000
          filters: *filters
      - s5cmd-orb/mv:
          name: integration-test-mv
          executor: minio
          pre-steps:
            - setup-minio-bucket:
                seed_object: true
          from: "s3://test-bucket/s5cmd-orb/build_asset.txt"
          to: "s3://test-bucket/s5cmd-orb/build_asset_moved.txt"
          endpoint_url: http://localhost:9000
          filters: *filters
      - s5cmd-orb/rm:
          name: integration-test-rm
          executor: minio
          pre-steps:
            - setup-minio-bucket:
                seed_object: true
          target: "s3://test-bucket/s5cmd-orb/*"
          endpoint_url: http://localhost:9000
          filters: *filters
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: aduro-orbs/s5cmd-orb
          vcs_type: github
          pub_type: production
          enable_pr_comment: true
          requires:
            - orb-tools/pack
            - integration-test-install-docker-base
            - integration-test-sync
            - integration-test-cp
            - integration-test-ls
            - integration-test-mv
            - integration-test-rm
          filters: *release-filters

executors:
  minio:
    docker:
      - image: cimg/aws:2026.09.1
        environment:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
      - image: minio/minio
        command: server /data
        environment:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
  docker-base:
    docker:
      - image: cimg/base:stable
  macos:
    macos:
      xcode: 16.2.0
    resource_class: m4pro.medium
