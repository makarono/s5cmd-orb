version: 2.1
orbs:
  orb-tools: circleci/orb-tools@12.0
  aws-cli: circleci/aws-cli@5.1.1
  s5cmd-orb: {}
filters: &filters
  tags:
    only: /.*/
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  integration-test-install:
    parameters:
      executor:
        type: executor
      version:
        description: Select a specific version of the s5cmd. By default the 2.2.2 version will be used.
        default: 2.2.2
        type: string
      override_installed:
        type: boolean
        default: false
      binary_dir:
        type: string
        default: "/usr/local/bin"
        description: |
          Specify the binary directory
      install_dir:
        type: string
        default: "/usr/local/s5cmd"
        description: |
          Specify the installation directory
    executor: <<parameters.executor>>
    steps:
      - s5cmd-orb/install:
          version: <<parameters.version>>
          override_installed: <<parameters.override_installed>>
          binary_dir: <<parameters.binary_dir>>
          install_dir: <<parameters.install_dir>>

workflows:
  test-deploy:
    # PLACEHOLDER_OIDC_CONTEXT, PLACEHOLDER_ACCOUNT_ID, PLACEHOLDER_S5CMD_TEST_ROLE, and
    # PLACEHOLDER_S5CMD_TEST_BUCKET must be replaced with real values before these
    # integration tests can run.
    jobs:
      - integration-test-install:
          name: integration-test-install-<<matrix.executor>>
          matrix:
            alias: integration-test-install
            parameters:
              executor: [docker-base, macos]
      - s5cmd-orb/sync:
          name: integration-test-sync
          pre-steps:
            - run: mkdir -p /tmp/s5cmd-test-bucket && echo "lorem ipsum" > /tmp/s5cmd-test-bucket/build_asset.txt
          auth:
            - aws-cli/setup:
                role_arn: arn:aws:iam::PLACEHOLDER_ACCOUNT_ID:role/PLACEHOLDER_S5CMD_TEST_ROLE
                role_session_name: "s5cmd-orb-test-session"
                profile_name: "OIDC-User"
          from: "/tmp/s5cmd-test-bucket/"
          to: "s3://PLACEHOLDER_S5CMD_TEST_BUCKET/s5cmd-orb-sync/"
          profile_name: "OIDC-User"
          context: [PLACEHOLDER_OIDC_CONTEXT]
          filters: *filters
      - s5cmd-orb/cp:
          name: integration-test-cp
          pre-steps:
            - run: mkdir -p /tmp/s5cmd-test-bucket && echo "lorem ipsum" > /tmp/s5cmd-test-bucket/build_asset.txt
          auth:
            - aws-cli/setup:
                role_arn: arn:aws:iam::PLACEHOLDER_ACCOUNT_ID:role/PLACEHOLDER_S5CMD_TEST_ROLE
                role_session_name: "s5cmd-orb-test-session"
                profile_name: "OIDC-User"
          from: "/tmp/s5cmd-test-bucket/build_asset.txt"
          to: "s3://PLACEHOLDER_S5CMD_TEST_BUCKET/s5cmd-orb/build_asset.txt"
          profile_name: "OIDC-User"
          context: [PLACEHOLDER_OIDC_CONTEXT]
          filters: *filters
      - s5cmd-orb/ls:
          name: integration-test-ls
          auth:
            - aws-cli/setup:
                role_arn: arn:aws:iam::PLACEHOLDER_ACCOUNT_ID:role/PLACEHOLDER_S5CMD_TEST_ROLE
                role_session_name: "s5cmd-orb-test-session"
                profile_name: "OIDC-User"
          target: "s3://PLACEHOLDER_S5CMD_TEST_BUCKET/s5cmd-orb/"
          profile_name: "OIDC-User"
          context: [PLACEHOLDER_OIDC_CONTEXT]
          filters: *filters
          requires:
            - integration-test-cp
      - s5cmd-orb/mv:
          name: integration-test-mv
          auth:
            - aws-cli/setup:
                role_arn: arn:aws:iam::PLACEHOLDER_ACCOUNT_ID:role/PLACEHOLDER_S5CMD_TEST_ROLE
                role_session_name: "s5cmd-orb-test-session"
                profile_name: "OIDC-User"
          from: "s3://PLACEHOLDER_S5CMD_TEST_BUCKET/s5cmd-orb/build_asset.txt"
          to: "s3://PLACEHOLDER_S5CMD_TEST_BUCKET/s5cmd-orb/build_asset_moved.txt"
          profile_name: "OIDC-User"
          context: [PLACEHOLDER_OIDC_CONTEXT]
          filters: *filters
          requires:
            - integration-test-ls
      - s5cmd-orb/rm:
          name: integration-test-rm
          auth:
            - aws-cli/setup:
                role_arn: arn:aws:iam::PLACEHOLDER_ACCOUNT_ID:role/PLACEHOLDER_S5CMD_TEST_ROLE
                role_session_name: "s5cmd-orb-test-session"
                profile_name: "OIDC-User"
          target: "s3://PLACEHOLDER_S5CMD_TEST_BUCKET/s5cmd-orb/*"
          profile_name: "OIDC-User"
          context: [PLACEHOLDER_OIDC_CONTEXT]
          filters: *filters
          requires:
            - integration-test-mv
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: s5cmd-orb
          vcs_type: github
          pub_type: production
          enable_pr_comment: true
          requires:
            - orb-tools/pack
            - integration-test-install-docker-base
            - integration-test-sync
            - integration-test-cp
            - integration-test-ls
            - integration-test-mv
            - integration-test-rm
          context: orb-publisher
          filters: *release-filters

executors:
  terraform:
    docker:
      - image: hashicorp/terraform:1.4.1
  alpine:
    docker:
      - image: alpine:latest
  docker-base:
    docker:
      - image: cimg/base:stable
  docker-base-withenv:
    docker:
      - image: cimg/base:stable
        environment:
          AWS_ACCESS_KEY_ID: "key"
          AWS_SECRET_ACCESS_KEY: "secret"
  docker-nounset-shell:
    shell: /bin/bash -o nounset
    docker:
      - image: cimg/base:stable
  macos:
    macos:
      xcode: 14.2.0
  arm:
    machine:
      image: ubuntu-2004:current
    resource_class: arm.medium
  linuxvm:
    machine:
      image: ubuntu-2004:current
  windows:
    machine:
      image: windows-server-2019-vs2019:current
    shell: bash.exe
    resource_class: windows.medium

commands:
  check_aws_version:
    parameters:
      version:
        type: string
        default: ""
    steps:
      - run:
          name: check_aws_version
          command: |
            aws --version
            if [ -n "<<parameters.version>>" ]; then
              INSTALLED_AWS_VERSION="$(aws --version)"
              aws --version | grep <<parameters.version>>
            else
              if ! command -v aws &> /dev/null; then exit 1; else exit 0; fi
            fi
